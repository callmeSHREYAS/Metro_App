services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metro_db}
      POSTGRES_USER: ${POSTGRES_USER:-metro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metro_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metro_user} -d ${POSTGRES_DB:-metro_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
